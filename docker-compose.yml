  bulmq-service:
    container_name: bulmq-service
    build: ./services/bulmq-service
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
    env_file: ./services/bulmq-service/.env
    networks:
      - hosta-network

  socketio-service:
    container_name: socketio-service
    build: ./services/socketio-service
    ports:
      - "3019:3019"
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
    env_file: ./services/socketio-service/.env
    networks:
      - hosta-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - hosta-network

  restore-test-db:
    image: postgres:17-alpine
    container_name: restore-test-db
    restart: always
    environment:
      POSTGRES_USER: hosta_user
      POSTGRES_PASSWORD: "Hosta@123"
    ports:
      - "5432:5432"
    volumes:
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    networks:
      - hosta-network

networks:
  hosta-network:
    name: hosta-network
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"


