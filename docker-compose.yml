services:
  api-gateway:
    container_name: api-gateway
    build: ./services/api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
    env_file:
      - ./services/api-gateway/.env
    depends_on:
      - user-service
      - ambulance-service
      - blood-service
      - blood-bank-service
      - staff-service
      - booking-service
      - notification-service
      - review-service
      - ads-service 
      - role-service  
      - s3-service
      - bulmq-service
      - socketio-service
      - speciality-service
      - doctor-service
      - hospital-service
      - auth-service
    networks:
      - hosta-network

  user-service:
    container_name: user-service
    build: ./services/user-service
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
    env_file:
