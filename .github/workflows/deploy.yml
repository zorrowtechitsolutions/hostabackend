
name: Hosta CI/CD - Demo and Production

on:
  push:
    branches:
      - demo
      - production

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosta-${{ github.ref_name }}-deployment
  cancel-in-progress: false

jobs:
  # =========================================
  # BUILD ALL MICROSERVICES
  # =========================================
  build:
    name: Build ${{ matrix.service }}
    if: github.ref_name == 'demo' || github.ref_name == 'production'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service:
          - ads-service
          - ambulance-service
          - api-gateway
          - blood-bank-service
          - blooddonor-service
          - booking-service
          - bulmq-service
          - doctor-service
          - hospital-service
          - notification-service
          - review-service
          - role-service
          - s3-service
          - socketio-service
          - speciality-service
          - staff-service
          - user-service
          - auth-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare image tags
        id: prep
        shell: bash
        env:
          SERVICE: ${{ matrix.service }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -eu

          IMAGE="${DOCKERHUB_USERNAME}/hosta-${SERVICE}"

          if [ "$BRANCH_NAME" = "demo" ]; then
            {
              echo "tags<<EOF"
              echo "${IMAGE}:demo-latest"
              echo "${IMAGE}:demo-${COMMIT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

          elif [ "$BRANCH_NAME" = "production" ]; then
            {
              echo "tags<<EOF"
              echo "${IMAGE}:latest"
              echo "${IMAGE}:prod-${COMMIT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

          else
            exit 1
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.service }}
          cache-to: type=gha,scope=${{ github.ref_name }}-${{ matrix.service }},mode=max

  # =========================================
  # DEPLOY DEMO
  # =========================================
  deploy_demo:
    name: Sync files and deploy Demo EC2
    if: github.ref == 'refs/heads/demo'
    needs: build
    runs-on: ubuntu-latest
    environment: demo

    steps:
      - name: Checkout demo code
        uses: actions/checkout@v4

      # Package repository files but NEVER package .env files
      
      - name: Create deployment archive
        shell: bash
        run: |
          set -eu

          ARCHIVE="$RUNNER_TEMP/hosta-deploy.tar.gz"

          # Create the archive outside the repository directory
          tar \
            --exclude='.git' \
            --exclude='*/.git' \
            --exclude='node_modules' \
            --exclude='*/node_modules' \
            --exclude='.env*' \
            --exclude='*/.env*' \
            --exclude='hosta-deploy.tar.gz' \
            -czf "$ARCHIVE" \
            -C "$GITHUB_WORKSPACE" \
            .

          # Copy it into the workspace for the SCP action
          cp "$ARCHIVE" "$GITHUB_WORKSPACE/hosta-deploy.tar.gz"

          test -s "$GITHUB_WORKSPACE/hosta-deploy.tar.gz"
          echo "Demo deployment archive created successfully."
          ls -lh "$GITHUB_WORKSPACE/hosta-deploy.tar.gz"


      - name: Copy updated project files to Demo EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: hosta-deploy.tar.gz
          target: /home/ubuntu/hostabackend-demo
          overwrite: true

      - name: Deploy Demo
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_PASSWORD
          script: |
            set -eu

            cd /home/ubuntu/hostabackend-demo

            # Update project files while preserving existing .env files
            tar -xzf hosta-deploy.tar.gz
            rm -f hosta-deploy.tar.gz

            # Use the existing environment files
            test -f docker-compose.demo.yml

            echo "$DOCKERHUB_PASSWORD" | \
              sudo docker login \
                --username "$DOCKERHUB_USERNAME" \
                --password-stdin

            # Validate before changing running services
            sudo docker compose \
              -p hostabackend-demo \
              -f docker-compose.demo.yml config -q

            # Pull new demo images
            sudo docker compose \
              -p hostabackend-demo \
              -f docker-compose.demo.yml pull

            # Update services without taking everything down first
            sudo docker compose \
              -p hostabackend-demo \
              -f docker-compose.demo.yml up -d --no-build --remove-orphans

            sudo docker compose \
              -p hostabackend-demo \
              -f docker-compose.demo.yml ps

            echo "Demo deployment completed."

  # =========================================
  # DEPLOY PRODUCTION
  # =========================================
  deploy_production:
    name: Sync files and deploy Production EC2
    if: github.ref == 'refs/heads/production'
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout production code
        uses: actions/checkout@v4

      # Package repository files but NEVER package .env files
      
      - name: Create deployment archive
        shell: bash
        run: |
          set -eu

          ARCHIVE="$RUNNER_TEMP/hosta-deploy.tar.gz"

          # Create archive outside the repository directory
          tar \
            --exclude='.git' \
            --exclude='*/.git' \
            --exclude='node_modules' \
            --exclude='*/node_modules' \
            --exclude='.env*' \
            --exclude='*/.env*' \
            --exclude='hosta-deploy.tar.gz' \
            -czf "$ARCHIVE" \
            -C "$GITHUB_WORKSPACE" \
            .

          # Copy archive into workspace for the SCP action
          cp "$ARCHIVE" "$GITHUB_WORKSPACE/hosta-deploy.tar.gz"

          test -s "$GITHUB_WORKSPACE/hosta-deploy.tar.gz"
          echo "Production deployment archive created successfully."
          ls -lh "$GITHUB_WORKSPACE/hosta-deploy.tar.gz"
 
      - name: Copy updated project files to Production EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: hosta-deploy.tar.gz
          target: /home/ubuntu/hostabackend-prod
          overwrite: true

      - name: Deploy Production
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_PASSWORD
          script: |
            set -eu

            cd /home/ubuntu/hostabackend-prod

            # Update project files without replacing existing .env files
            tar -xzf hosta-deploy.tar.gz
            rm -f hosta-deploy.tar.gz

            # Use existing production environment files
            test -f docker-compose.prod.yml

            echo "$DOCKERHUB_PASSWORD" | \
              sudo docker login \
                --username "$DOCKERHUB_USERNAME" \
                --password-stdin

            # Validate Compose configuration before deployment
            sudo docker compose \
              -p hostabackend-prod \
              -f docker-compose.prod.yml config -q

            # Pull updated production images
            sudo docker compose \
              -p hostabackend-prod \
              -f docker-compose.prod.yml pull

            # Update services without a full shutdown first
            sudo docker compose \
              -p hostabackend-prod \
              -f docker-compose.prod.yml up -d --remove-orphans

            sudo docker compose \
              -p hostabackend-prod \
              -f docker-compose.prod.yml ps

            echo "Production deployment completed."
